  test-os-lib:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: Test system_info_library on ${{ matrix.os }} (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install distro pywin32 wmi psycopg2-binary telethon

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Debug info for OS lib
      run: |
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "PYTHONPATH: $PYTHONPATH"
        echo "OS: ${{ matrix.os }}"
        ls -la
        ls -la system_info_library/ || echo "system_info_library folder not found"

    - name: Test system_info_library imports
      run: |
        python -c '
import sys
import platform
print("=" * 60)
print("TESTING SYSTEM_INFO_LIBRARY IMPORTS")
print("=" * 60)
try:
    from system_info_library.main import get_system_info
    print("✅ get_system_info imported successfully")
    from system_info_library.models import SystemInfo, OSInfo, LowLevelInfo, DriverInfo
    print("✅ models imported successfully")
    from system_info_library.collectors import collector_controller
    print("✅ collectors imported successfully")
    from system_info_library.low_level import low_level_controller
    print("✅ low_level imported successfully")
    from system_info_library.drivers import driver_controller
    print("✅ drivers imported successfully")
    from system_info_library.error_logger import get_logger
    print("✅ error_logger imported successfully")
    print("\n✅ ALL IMPORTS SUCCESSFUL")
except Exception as e:
    print(f"❌ Import error: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
'

    - name: Test system_info_library basic functionality
      run: |
        python -c '
import sys
import json
import platform
print("=" * 60)
print("TESTING SYSTEM_INFO_LIBRARY BASIC FUNCTIONALITY")
print("=" * 60)
try:
    from system_info_library.main import get_system_info
    os_name = platform.system()
    print(f"Testing on OS: {os_name}")
    
    print("\n📋 TEST 1: Standard mode")
    result_standard = get_system_info(mode="standard")
    print(f"Success: {result_standard.success}")
    print(f"OS detected: {result_standard.os_detected}")
    if result_standard.os:
        print(f"OS Name: {result_standard.os.os_name}")
    print("✅ Standard mode test passed")
    
    print("\n📋 TEST 2: Advanced mode")
    result_advanced = get_system_info(mode="advanced")
    print(f"Success: {result_advanced.success}")
    if result_advanced.hardware:
        print(f"CPU: {result_advanced.hardware.cpu is not None}")
        print(f"Memory: {result_advanced.hardware.memory is not None}")
    if result_advanced.drivers:
        print(f"Drivers: {result_advanced.drivers.has_admin_access is not None}")
    print("✅ Advanced mode test passed")
    
    print("\n📋 TEST 3: Flat dictionary format")
    flat_dict = result_advanced.to_flat_dict()
    print(f"Flat dict keys count: {len(flat_dict)}")
    sample_keys = list(flat_dict.keys())[:5]
    print(f"Sample keys: {sample_keys}")
    print("✅ Flat dictionary test passed")
    
    print("\n✅ ALL BASIC TESTS PASSED")
except Exception as e:
    print(f"❌ Error in basic functionality test: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
'