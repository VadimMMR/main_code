name: Check Docker Hub Images
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull images
        run: |
          docker pull dayg0555/hardware_collector_lib:latest
          docker pull dayg0555/system-info-library:latest
          echo "✅ Images pulled successfully"

      - name: Show structure
        run: |
          echo "📁 HW library files:"
          docker run --rm dayg0555/hardware_collector_lib:latest ls -la /app 2>/dev/null || echo "No /app"
          echo "📁 OS library files:"
          docker run --rm dayg0555/system-info-library:latest ls -la /app 2>/dev/null || echo "No /app"
          echo "✅ Structure check complete"

      - name: Test run
        run: |
          docker run --rm dayg0555/hardware_collector_lib:latest echo "HW OK"
          docker run --rm dayg0555/system-info-library:latest echo "OS OK"
          echo "✅ Both images work!"

      - name: Success
        if: success()
        run: echo "🎉 ALL GOOD!"
