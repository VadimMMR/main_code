name: Check Docker Hub Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-docker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: 
          - "dayg0555/hardware_collector_lib:latest"
          - "dayg0555/system-info-library:latest"
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if image exists
        id: check_image
        run: |
          echo "🔍 Checking ${{ matrix.image }}..."
          if timeout 30 docker manifest inspect ${{ matrix.image }} > /dev/null 2>&1; then
            echo "✅ Image exists"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Image not found"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Test pull
        if: steps.check_image.outputs.status == 'success'
        run: |
          docker pull ${{ matrix.image }}
          echo "✅ Pull OK"

  check-main-project:
    needs: check-docker-images
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify images exist
        id: check_status
        run: |
          echo "📋 Checking images..."
          docker pull dayg0555/hardware_collector_lib:latest || HW_STATUS="failure" && echo "❌ HW lib missing" || HW_STATUS="success"
          docker pull dayg0555/system-info-library:latest || OS_STATUS="failure" && echo "❌ OS lib missing" || OS_STATUS="success"
          echo "hw_status=$HW_STATUS" >> $GITHUB_OUTPUT
          echo "os_status=$OS_STATUS" >> $GITHUB_OUTPUT

      - name: Build integration test
        if: steps.check_status.outputs.hw_status == 'success' && steps.check_status.outputs.os_status == 'success'
        run: |
          echo "🏗️ Multi-stage build test..."
          
          cat > requirements.txt << EOF
          psutil==5.9.8
          py-cpuinfo==9.0.0
          psycopg2-binary==2.9.9
          EOF

                    cat > main.py << EOF
          import sys, os, json
          try:
              from hardware_collector_lib.main import get_device_info
              from system_info_library.main import get_system_info
              print("✅ IMPORTS SUCCESS")
              print("Hardware keys:", list(get_device_info().keys())[:3])
              print("System info:", get_system_info(mode="standard"))
          except Exception as e:
              print("❌ ERROR:", str(e))
              sys.exit(1)
          EOF

                    cat > Dockerfile.test << EOF
          FROM dayg0555/hardware_collector_lib:latest as hw_lib
          FROM dayg0555/system-info-library:latest as os_lib
          FROM python:3.11-slim

          WORKDIR /app

          # Copy libraries from Docker Hub images
          COPY --from=hw_lib /app /app/hardware_collector_lib
          COPY --from=os_lib /app /app/system_info_library

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY main.py .

          ENV PYTHONPATH=/app

          # Test imports
          RUN python -c "from hardware_collector_lib.main import get_device_info; from system_info_library.main import get_system_info; print('✅ LIBRARIES OK')"

          CMD ["python", "main.py"]
          EOF

                    docker build -f Dockerfile.test -t test-project .
                    docker run --rm test-project
                    echo "✅ INTEGRATION TEST PASSED!"

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.check_status.outputs.hw_status }}" = "success" ] && [ "${{ steps.check_status.outputs.os_status }}" = "success" ]; then
            echo "🎉 All images OK and integration test passed!"
          else
            echo "❌ Some images missing!"
            echo "hardware_collector_lib: ${{ steps.check_status.outputs.hw_status }}"
            echo "system-info-library: ${{ steps.check_status.outputs.os_status }}"
            exit 1
          fi
