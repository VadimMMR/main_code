name: Check Docker Hub Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-docker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: 
          - "dayg0555/hardware_collector_lib:latest"
          - "dayg0555/system-info-library:latest"
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if image exists on Docker Hub
        id: check_image
        run: |
          echo "🔍 Checking ${{ matrix.image }}..."
          if timeout 30 docker manifest inspect ${{ matrix.image }} > /dev/null 2>&1; then
            echo "✅ Image exists"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Image not found"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Test pulling image
        if: steps.check_image.outputs.status == 'success'
        run: |
          echo "🐳 Pulling ${{ matrix.image }}..."
          docker pull ${{ matrix.image }}
          echo "✅ Pull successful"

      - name: Test container creation
        if: steps.check_image.outputs.status == 'success'
        run: |
          echo "🚀 Testing container creation..."
          docker create --name test ${{ matrix.image }}
          docker rm test
          echo "✅ Container test passed"

  check-main-project:
    needs: check-docker-images
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check all required images
        id: check_status
        run: |
          echo "📋 Checking required images:"
          
          if timeout 30 docker manifest inspect dayg0555/hardware_collector_lib:latest > /dev/null 2>&1; then
            echo "✅ hardware_collector_lib: OK"
            HW_STATUS="success"
          else
            echo "❌ hardware_collector_lib: MISSING"
            HW_STATUS="failure"
          fi
          
          if timeout 30 docker manifest inspect dayg0555/system-info-library:latest > /dev/null 2>&1; then
            echo "✅ system-info-library: OK"
            OS_STATUS="success"
          else
            echo "❌ system-info-library: MISSING"
            OS_STATUS="failure"
          fi
          
          echo "hw_status=$HW_STATUS" >> $GITHUB_OUTPUT
          echo "os_status=$OS_STATUS" >> $GITHUB_OUTPUT

      - name: Build test project
        if: steps.check_status.outputs.hw_status == 'success' && steps.check_status.outputs.os_status == 'success'
        run: |
          echo "🏗️ Building test project..."
          
          cat > requirements.txt << REQ_EOF
          psutil==5.9.8
          py-cpuinfo==9.0.0
          psycopg2-binary==2.9.9
          REQ_EOF
                    
                    cat > main.py << MAIN_EOF
          import sys
          import os
          import json

          try:
              from hardware_collector_lib.main import get_device_info
              from system_info_library.main import get_system_info
              print("✅ Both libraries imported successfully")
              
              hw_info = get_device_info()
              print("✅ Hardware info keys:", list(hw_info.keys())[:5])
              
              sys_info = get_system_info(mode="standard")
              print("✅ System info obtained")
              
          except Exception as e:
              print("❌ Import error:", str(e))
              sys.exit(1)
          MAIN_EOF
                    
                    cat > Dockerfile.test << DF_EOF
          FROM python:3.11-slim

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY main.py .

          ENV PYTHONPATH=/app

          RUN python -c "from hardware_collector_lib.main import get_device_info; from system_info_library.main import get_system_info; print('Libraries OK')"

          CMD ["python", "main.py"]
          DF_EOF

                    docker build -f Dockerfile.test -t test-project .
                    
                    if docker image inspect test-project > /dev/null 2>&1; then
                      echo "✅ Image built successfully"
                      docker run --rm test-project
                    else
                      echo "❌ Build failed"
                      exit 1
                    fi
                    
                    echo "✅ All tests passed!"

                - name: Report failure
                  if: failure()
                  run: |
                    echo "❌ Docker Hub images check failed!"
                    echo "Check these images:"
                    echo "- dayg0555/hardware_collector_lib:latest"
                    echo "- dayg0555/system-info-library:latest"
                    exit 1

                - name: Report success
                  if: success()
                  run: |
                    echo "🎉 All Docker Hub images are available!"
                    echo "✅ hardware_collector_lib:latest"
                    echo "✅ system-info-library:latest"
                    echo "✅ Test build successful"
